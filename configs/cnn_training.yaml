# Downstream CNN classifier training (paper §3.7)

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  validation_split: 0.1      # 10% validation
  early_stopping_patience: 0 # no early stopping
  seed: 42

data:
  dataset_dir: "data/DevanagariHandwrittenDigitDataset"
  csv_file: "data/hindi_mnist.csv"

model:
  num_classes: 10
  dropout: 0.6

optimization:
  optimizer: "adam"
  scheduler: null   # cosine | step | exponential

device:
  device: "auto"    # auto | cuda | mps | cpu

output:
  output_dir: "experiments/cnn_models"
  save_frequency: 1
