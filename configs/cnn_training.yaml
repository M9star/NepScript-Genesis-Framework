# CNN Training Configuration

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  validation_split: 0.2
  early_stopping_patience: 10
  seed: 42

data:
  dataset_dir: "data/DevanagariHandwrittenDigitDataset"
  csv_file: "data/hindi_mnist.csv"

model:
  num_classes: 10
  dropout: 0.3

optimization:
  optimizer: "adam"
  scheduler: null  # optional: "cosine", "step", "exponential"

device:
  device: "auto"  # auto, cuda, mps, cpu

output:
  output_dir: "experiments/cnn_models"
  save_frequency: 1  # save every N epochs
