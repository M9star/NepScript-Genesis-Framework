# Unified NAS configuration for Conditional DCGAN
# Strategies: adaptive | progressive | multifidelity | random | adversarial

strategy: adaptive
num_architectures: 15   # candidates to evaluate (ignored for adversarial)
base_epochs: 30         # epochs per sampled arch (search epochs for adversarial)

# GAN training
d_update_freq: 2
g_lr: 0.0002
d_lr: 0.0002
beta1: 0.5

data:
  data_dir: 'data/DevanagariHandwrittenDigitDataset'
  labels_csv: 'data/hindi_mnist.csv'
  batch_size: 64
  max_subset_per_class: 1700   # null = full dataset
  split: null
  num_workers: 4

device: auto
save_results: True
output_dir: 'experiments/gan_run_models_and_images/nas_results'

# Strategy-specific settings
adaptive:
  adaptation_threshold: 0.6
  mutation_rate: 0.7
  min_exploration: 3

progressive:
  # Phases auto-allocated from num_architectures (coarse -> fine)

multifidelity:
  quick_epochs: 10
  medium_epochs: 20
  full_epochs: 30
  quick_threshold: 0.35
  medium_threshold: 0.60

adversarial:
  lr_arch: 0.001
  lr_weights: 0.0002
  warmup_epochs: 3
  temperature: 1.0
  grad_clip: 5.0
  arch_weight_decay: 1e-3
  alternate_updates: False
  snapshot_interval: 5
  validation_split: 0.2

final_training:
  epochs: 500
  g_lr: 0.0002
  d_lr: 0.0002
  batch_size: 64
  max_subset_per_class: null
  save_frequency: 50
  sample_frequency: 10
