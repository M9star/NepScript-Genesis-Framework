# Final model training (Conditional DCGAN)

epochs: 500
g_lr: 0.0002
d_lr: 0.0002
d_update_freq: 2
beta1: 0.5
batch_size: 64

data:
  data_dir: 'data/DevanagariHandwrittenDigitDataset'
  labels_csv: 'data/hindi_mnist.csv'
  max_subset_per_class: 2000
  num_workers: 4
  pin_memory: true
  split: null
  augment: true

save_every: 50
gen_save_every: 10
checkpoint_dir: 'experiments/gan_run_models_and_images/final_training/models'
image_dir: 'experiments/gan_run_models_and_images/final_training/images'

device: auto

label_smoothing:
  enabled: True
  real_label: 0.9
  fake_label: 0.1

verbose: true
log_interval: 10
