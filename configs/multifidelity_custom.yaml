# Custom Multifidelity NAS Configuration
# This config sets custom epoch counts for each evaluation stage

strategy: multifidelity
num_architectures: 15

# Custom multifidelity epochs
multifidelity:
  quick_epochs: 10      # Quick screening
  medium_epochs: 20     # Medium evaluation
  full_epochs: 30       # Full evaluation
  quick_threshold: 0.5  # Score threshold to advance from quick to medium
  medium_threshold: 0.7 # Score threshold to advance from medium to full

# Data configuration
data:
  data_dir: data/DevanagariHandwrittenDigitDataset
  labels_csv: data/hindi_mnist.csv
  batch_size: 32
  max_subset_per_class: 2000
  split: Train
  num_workers: 4

# Training configuration
base_epochs: 30  # Used as fallback

# Device
device: auto

# Output
save_results: true
output_dir: experiments/gan_run_models_and_images/nas_results