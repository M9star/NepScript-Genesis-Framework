# Multi-fidelity NAS configuration (custom epoch stages)

strategy: multifidelity
num_architectures: 15
base_epochs: 30   # fallback

multifidelity:
  quick_epochs: 10
  medium_epochs: 20
  full_epochs: 30
  quick_threshold: 0.5
  medium_threshold: 0.7

data:
  data_dir: data/DevanagariHandwrittenDigitDataset
  labels_csv: data/hindi_mnist.csv
  batch_size: 32
  max_subset_per_class: 2000
  split: Train
  num_workers: 4

device: auto
save_results: true
output_dir: experiments/gan_run_models_and_images/nas_results
