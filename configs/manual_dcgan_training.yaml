# Manual DCGAN baseline (paper §3.2)
# Architecture is supplied via --arch-file.
# NOTE: baseline architecture identity is under review — see PAPER_REPO_AUDIT.md (Item 9).

epochs: 500
g_lr: 0.0002
d_lr: 0.0002
beta1: 0.5
d_update_freq: 2
batch_size: 64

label_smoothing:
  enabled: true
  real_label: 0.9
  fake_label: 0.1

data:
  data_dir: 'data/DevanagariHandwrittenDigitDataset'
  labels_csv: 'data/hindi_mnist.csv'
  max_subset_per_class: null
  split: null
  num_workers: 4
  pin_memory: true
  augment: true

checkpoint_dir: 'experiments/manual_dcgan/checkpoints'
image_dir: 'experiments/manual_dcgan/images'
save_every: 50
gen_save_every: 10

device: auto

early_stopping:
  enabled: false
  patience: 50
  min_delta: 0.001
  divergence_threshold: 10.0
  mode_collapse_window: 15

carbon_tracking:
  enabled: true
  country_iso_code: 'NPL'

verbose: true
log_interval: 10
